name: Build Megan Godot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Megan_Godot_REAL_GAME_Step1_WORKING.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Godot project
        run: |
          rm -rf godot_project
          mkdir -p godot_project
          unzip -q Megan_Godot_REAL_GAME_Step1_WORKING.zip -d godot_project
          echo "Project contents:"
          find godot_project -maxdepth 3 -type f | sort

      - name: Find Godot project directory
        id: project
        shell: bash
        run: |
          PROJECT_FILE="$(find godot_project -type f -name project.godot -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Godot project directory: $PROJECT_DIR"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Install Godot Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot_templates
          cp -a /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          EOF

      - name: Import Godot project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          godot --headless --editor --quit

      - name: Verify Android export preset
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ ! -f export_presets.cfg ]; then
            echo "ERROR: export_presets.cfg is missing."
            exit 1
          fi

          echo "Export presets:"
          grep 'name=' export_presets.cfg || true

      - name: Build Android APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          mkdir -p build
          godot --headless --export-debug "Android Debug" build/MeganMagicalAdventure.apk

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          test -f build/MeganMagicalAdventure.apk
          ls -lh build/MeganMagicalAdventure.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Megan-Magical-Adventure-APK
          path: ${{ steps.project.outputs.dir }}/build/MeganMagicalAdventure.apk
          if-no-files-found: error
