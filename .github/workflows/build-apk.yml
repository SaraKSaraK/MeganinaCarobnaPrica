name: Build Megan Godot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Megan_Godot_REAL_GAME_Step1_FIXED.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Godot project
        run: |
          rm -rf godot_project
          mkdir godot_project
          unzip -q Megan_Godot_REAL_GAME_Step1_FIXED.zip -d godot_project
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install Godot Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Configure Godot Android paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          EOF

      - name: Import Godot project
        working-directory: godot_project/megan_godot_step1
        run: |
          godot --headless --editor --quit

      - name: Build Android APK
        working-directory: godot_project/megan_godot_step1
        run: |
          mkdir -p build
          godot --headless --export-debug "Android Debug" build/MeganMagicalAdventure-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Megan-Magical-Adventure-APK
          path: godot_project/megan_godot_step1/build/MeganMagicalAdventure-debug.apk
